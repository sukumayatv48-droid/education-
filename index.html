<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education - GK Earning & Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; padding-bottom: 80px; }
        .navbar { background: linear-gradient(135deg, #1e1e2f 0%, #111111 100%); padding: 15px 0; border-bottom: 3px solid #ff4757; position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { font-size: 1.7rem; letter-spacing: 2px; color: #ffffff !important; text-transform: uppercase; font-weight: bold; }
        .navbar-brand span { color: #ff4757; }
        .balance-card { background: #fff; padding: 5px 15px; border-radius: 50px; border: 2px solid #ff4757; color: #1e1e2f; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        /* Home Boxes */
        .home-box { border-radius: 20px; padding: 40px 10px; color: white; text-align: center; cursor: pointer; transition: 0.3s; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .bg-quiz-home { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .bg-ebook-home { background: linear-gradient(45deg, #1e3c72, #2a5298); }
        .bg-notice-home { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .bg-pdf-home { background: linear-gradient(45deg, #6a11cb, #2575fc); }
        .bg-auth-home { background: linear-gradient(45deg, #4b6cb7, #182848); }
        
        .dash-box { border-radius: 15px; padding: 25px; color: white; text-align: center; cursor: pointer; transition: 0.3s; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .bg-new { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .bg-old { background: linear-gradient(45deg, #4b6cb7, #182848); }
        .bg-quiz { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .bg-exam { background: linear-gradient(45deg, #f80759, #bc4e9c); }
        
        .hidden { display: none; }
        .nav-link-custom { color: white !important; text-decoration: none; display: block; padding: 15px 25px; margin: 10px; border-radius: 12px; background: linear-gradient(90deg, #2c3e50, #000000); border-left: 5px solid #ff4757; }
        
        .set-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 12px; border-left: 6px solid #ff4757; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .set-card:hover { transform: scale(1.02); background: #fff5f6; }
        .set-info h5 { margin: 0; font-weight: bold; color: #1e1e2f; }

        #gk-detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 2000; overflow-y: auto; padding: 20px; }
        .gk-full-container { max-width: 800px; margin: 0 auto; padding-top: 50px; padding-bottom: 50px; }
        
        .q-text { font-size: 1.5rem; font-weight: 800; color: #1e1e2f; margin-bottom: 12px; display: block; line-height: 1.5; border-left: 6px solid #ff4757; padding-left: 15px; background: #fffafa; padding-top: 10px; padding-bottom: 10px; }
        .a-text { font-size: 1.2rem; color: #2f3542; background: #f1f2f6; padding: 10px 15px; border-radius: 8px; display: block; margin-bottom: 30px; font-weight: 500; }
        .back-btn-fixed { position: absolute; top: 15px; left: 15px; z-index: 2100; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #1e1e2f; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #ff4757; z-index: 1000; }
        .nav-item { color: #bbb; text-align: center; cursor: pointer; }
        
        .admin-num-box { background: #fff; border: 2px dashed #ff4757; padding: 12px; border-radius: 10px; margin-bottom: 15px; cursor: pointer; position: relative; transition: 0.2s; }
        .admin-num-box:hover { background: #fff5f5; }
        .copy-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #ff4757; }

        .ad-slot-container { margin: 25px 0; padding: 10px; background: #fdfdfd; border: 1px dashed #ddd; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="#" onclick="location.reload()"><span>E</span>DUCATION</a>
        <div class="balance-card" onclick="openWallet()">
            <i class="fa-solid fa-wallet text-success"></i>
            <span>रू <span id="user-balance">0.00</span></span>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div id="home-view">
        <div class="row g-3">
            <div class="col-6"><div class="home-box bg-quiz-home" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"><i class="fa-solid fa-trophy mb-2 fs-2"></i><h4>Live Quiz</h4></div></div>
            <div class="col-6"><div class="home-box bg-ebook-home" onclick="loadFirebaseHome('E-Book')"><i class="fa-solid fa-book-open mb-2 fs-2"></i><h4>E-Book</h4></div></div>
            <div class="col-6"><div class="home-box bg-notice-home" onclick="loadFirebaseHome('Notice')"><i class="fa-solid fa-bullhorn mb-2 fs-2"></i><h4>Notice</h4></div></div>
            <div class="col-6"><div class="home-box bg-pdf-home" onclick="loadFirebaseHome('PDF')"><i class="fa-solid fa-file-pdf mb-2 fs-2"></i><h4>PDF</h4></div></div>
            <div class="col-12" id="auth-btn-area">
                <div class="home-box bg-auth-home" onclick="showSection('auth-view')"><i class="fa-solid fa-user-circle mb-2 fs-2"></i><h4>Login / Register</h4></div>
            </div>
        </div>
    </div>

    <div id="gk-detail-view" class="hidden">
        <button class="btn btn-danger btn-sm back-btn-fixed" onclick="showSection('gk-set-list-view')">
            <i class="fa fa-arrow-left"></i> फर्कनुहोस्
        </button>
        <div class="gk-full-container">
            <h4 id="detail-set-title" class="fw-bold text-center text-danger mb-4"></h4>
            <div id="detail-content"></div>
        </div>
    </div>

    <div id="auth-view" class="hidden">
        <button class="btn btn-dark mt-4 w-100" onclick="showSection('home-view')">Back to Home</button>
    </div>

    <div id="dashboard-view" class="hidden">
        <h2 id="category-title" class="text-center mb-4 fw-bold text-uppercase"></h2>
        <div class="row g-4">
            <div class="col-6" onclick="loadGKSetList('New GK')"><div class="dash-box bg-new"><h5>New GK</h5></div></div>
            <div class="col-6" onclick="loadGKSetList('Old GK')"><div class="dash-box bg-old"><h5>Old GK</h5></div></div>
            <div class="col-6" onclick="confirmLiveQuiz()"><div class="dash-box bg-quiz"><h5>Live Quiz</h5></div></div>
            <div class="col-6" onclick="loadGKSetList('Exam')"><div class="dash-box bg-exam"><h5>Exam</h5></div></div>
        </div>
        <button class="btn btn-dark mt-4 w-100" onclick="showSection('home-view')">Back</button>
    </div>

    <div id="gk-set-list-view" class="hidden">
        <h3 id="set-list-header" class="fw-bold mb-4 text-center"></h3>
        <div id="set-container"></div>
        <button class="btn btn-dark mt-4 w-100" onclick="showSection('dashboard-view')">Back</button>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="showSection('home-view')"><i class="fa fa-home fs-4"></i><br><small>Home</small></div>
    <div class="nav-item" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"><i class="fa fa-list fs-4"></i><br><small>Menu</small></div>
    <div class="nav-item" onclick="openWallet()"><i class="fa fa-wallet fs-4"></i><br><small>Wallet</small></div>
</div>

<div class="offcanvas offcanvas-end" id="offcanvasNavbar">
    <div class="offcanvas-header bg-dark text-white"><h5>CATEGORIES</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body p-0" id="categoryMenu"></div>
</div>

<script type="module">
    // Firebase and Auth Logic
    // (तपाईंको पुरानो कोडको Firebase कन्फिग यहाँ हाल्नुहोला)
    
    // Updated GK Detail Logic with Ads
    window.showGKDetail = (title, content) => {
        showSection('gk-detail-view');
        document.getElementById('detail-set-title').innerText = title;
        const container = document.getElementById('detail-content');
        container.innerHTML = "";
        const lines = content.split('\n');
        let qCount = 0;

        lines.forEach(line => {
            if(line.trim() === "") return;
            const div = document.createElement('div');
            if (line.includes('?') || /^\d+\./.test(line.trim())) {
                qCount++;
                div.className = "q-text";
                div.innerText = line;
                container.appendChild(div);
            } else {
                div.className = "a-text";
                div.innerText = "उत्तर: " + line;
                container.appendChild(div);

                // हरेक २ प्रश्न पछि In-Page Ad स्लट
                if (qCount > 0 && qCount % 2 === 0) {
                    const adId = `ad-zone-${qCount}-${Date.now()}`;
                    const adSlot = document.createElement('div');
                    adSlot.id = adId;
                    adSlot.className = "ad-slot-container";
                    container.appendChild(adSlot);

                    const script = document.createElement('script');
                    script.src = 'https://nap5k.com/tag.min.js';
                    script.dataset.zone = '10823338';
                    document.getElementById(adId).appendChild(script);
                }
            }
        });
    };
</script>

<script>
    // UI Helpers (showSection, updateUI, etc.)
    function showSection(id) {
        document.querySelectorAll('.container > div, #gk-detail-view').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        window.scrollTo(0,0);
    }
</script>

<script src="https://alwingulla.com/tag.min.js" data-zone="10823338" data-sdk="show_10823338"></script>

</body>
</html>
