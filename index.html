<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBa2KIp-e3exRp3QDhMglpLSzWi55Os_Yc",
        authDomain: "education-57389.firebaseapp.com",
        projectId: "education-57389",
        storageBucket: "education-57389.firebasestorage.app",
        messagingSenderId: "868253124052",
        appId: "1:868253124052:web:def7f228d820015eb10241",
        databaseURL: "https://education-57389-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.currentUserUID = null;
    window.userData = null;

    // Quiz Global Vars
    let quizData = [];
    let currentQIndex = 0;
    let earnedInQuiz = 0;
    let timerInterval;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.currentUserUID = user.uid;
            onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                window.userData = snapshot.val();
                if(window.userData) {
                    updateUI(window.userData.balance);
                    document.getElementById('auth-btn-area').innerHTML = `<div class="home-box bg-auth-home" onclick="processLogout()"><i class="fa-solid fa-sign-out-alt mb-2 fs-2"></i><h4>Logout (${window.userData.name})</h4></div>`;
                }
            });
        } else {
            window.currentUserUID = null; window.userData = null; updateUI(0);
            document.getElementById('auth-btn-area').innerHTML = `<div class="home-box bg-auth-home" onclick="showSection('auth-view')"><i class="fa-solid fa-user-circle mb-2 fs-2"></i><h4>Login / Register</h4></div>`;
        }
    });

    window.confirmLiveQuiz = () => {
        if(!window.currentUserUID) return alert("पहिले लगइन गर्नुहोस्!");
        if(!window.userData || window.userData.balance < 20) return alert("न्यूनतम रू २० ब्यालेन्स हुनुपर्छ!");
        
        if(confirm("Live Quiz का लागि रू २० काटिनेछ। ५० प्रश्न हुनेछन्, प्रति सही उत्तर रू ०.५० पाइनेछ। तयार हुनुहुन्छ?")) {
            update(ref(db, 'users/' + window.currentUserUID), { balance: window.userData.balance - 20 });
            startLiveQuizSystem();
        }
    };

    function startLiveQuizSystem() {
        onValue(ref(db, 'sidebar_gk'), (snapshot) => {
            const data = snapshot.val();
            if(!data) return alert("डाटा भेटिएन!");
            
            // Collect all questions from Firebase
            let allQuestions = [];
            Object.values(data).forEach(cat => {
                Object.values(cat).forEach(type => {
                    Object.values(type).forEach(set => {
                        const lines = set.content.split('\n');
                        for(let i=0; i<lines.length; i++){
                            if(lines[i].includes('?') && lines[i+1]){
                                allQuestions.push({
                                    q: lines[i],
                                    a: lines[i+1].replace('उत्तर:', '').trim()
                                });
                            }
                        }
                    });
                });
            });

            // Randomize and pick 50
            quizData = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 50);
            currentQIndex = 0;
            earnedInQuiz = 0;
            showSection('quiz-active-view');
            loadNextQuizQuestion();
        }, { onlyOnce: true });
    }

    function loadNextQuizQuestion() {
        if(currentQIndex >= quizData.length) {
            clearInterval(timerInterval);
            alert("क्विज समाप्त! तपाईंले रू " + earnedInQuiz.toFixed(2) + " कमाउनुभयो।");
            location.reload();
            return;
        }

        const q = quizData[currentQIndex];
        document.getElementById('current-q-num').innerText = currentQIndex + 1;
        document.getElementById('quiz-earned').innerText = earnedInQuiz.toFixed(2);
        document.getElementById('quiz-question-text').innerText = q.q;

        // Options logic (1 correct, 3 fake)
        let options = [q.a, "काठमाडौँ", "नेपाल", "२०८०"]; // Fake options generator
        options = options.sort(() => 0.5 - Math.random());

        const container = document.getElementById('quiz-options-container');
        container.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkQuizAnswer(opt, q.a, btn);
            container.appendChild(btn);
        });

        startQuizTimer();
    }

    function startQuizTimer() {
        let timeLeft = 8;
        document.getElementById('quiz-timer').innerText = timeLeft;
        document.getElementById('sound-timer').play();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('quiz-timer').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('sound-wrong').play();
                currentQIndex++;
                setTimeout(loadNextQuizQuestion, 1000);
            }
        }, 1000);
    }

    function checkQuizAnswer(selected, correct, btn) {
        clearInterval(timerInterval);
        document.getElementById('sound-timer').pause();
        document.getElementById('sound-timer').currentTime = 0;

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if(selected === correct) {
            btn.classList.add('correct');
            document.getElementById('sound-correct').play();
            earnedInQuiz += 0.5;
            // Update balance in Firebase instantly
            update(ref(db, 'users/' + window.currentUserUID), { balance: window.userData.balance + 0.5 });
        } else {
            btn.classList.add('wrong');
            document.getElementById('sound-wrong').play();
            allBtns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
        }

        setTimeout(() => {
            currentQIndex++;
            loadNextQuizQuestion();
        }, 2000);
    }

    // Auth & Other Original Functions
    window.processRegister = async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        if(!name || !email || !pass) return alert("सबै विवरण भर्नुहोस्!");
        try {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            await set(ref(db, 'users/' + res.user.uid), { name, email, balance: 50.00 });
            alert("दर्ता सफल! बोनस रू ५० प्राप्त भयो।");
            showSection('home-view');
        } catch (e) { alert(e.message); }
    };

    window.processLogin = async () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            alert("लगइन सफल!");
            showSection('home-view');
        } catch (e) { alert("विवरण मिलेन!"); }
    };

    window.processLogout = () => signOut(auth);

    window.handleDeposit = () => {
        const amt = document.getElementById('dep-amount').value;
        const tid = document.getElementById('dep-id').value;
        if(!amt || !tid) return alert("विवरण भर्नुहोस्!");
        push(ref(db, 'requests/deposits'), { uid: window.currentUserUID, amount: amt, trxID: tid, status: 'pending', timestamp: Date.now() });
        alert("अनुरोध पठाइयो!");
        document.getElementById('deposit-ui').classList.add('hidden');
    };

    window.handleWithdraw = () => {
        const amt = parseFloat(document.getElementById('wit-amount').value);
        const num = document.getElementById('wit-number').value;
        if(amt < 100 || isNaN(amt)) return alert("न्यूनतम रू १०० हुनुपर्छ!");
        if(amt > window.userData.balance) return alert("ब्यालेन्स पुगेन!");
        update(ref(db, 'users/' + window.currentUserUID), { balance: window.userData.balance - amt });
        push(ref(db, 'requests/withdraws'), { uid: window.currentUserUID, amount: amt, number: num, status: 'pending', timestamp: Date.now() });
        alert("निकासी अनुरोध सफल!");
        document.getElementById('withdraw-ui').classList.add('hidden');
    };

    window.loadGKSetList = (type) => {
        showSection('gk-set-list-view');
        document.getElementById('set-list-header').innerText = currentCategory + " - " + type;
        const container = document.getElementById('set-container');
        container.innerHTML = "<p class='text-center'>Loading...</p>";
        onValue(ref(db, 'sidebar_gk/' + currentCategory + '/' + type), (s) => {
            const data = s.val();
            container.innerHTML = "";
            if (data) {
                const keys = Object.keys(data);
                keys.reverse().forEach((key, index) => {
                    const setNum = keys.length - index;
                    const div = document.createElement('div');
                    div.className = "set-card";
                    div.onclick = () => showGKDetail(`SET ${setNum}`, data[key].content);
                    div.innerHTML = `<div class="set-info"><h5>SET ${setNum}</h5><small>क्लिक गरेर पढ्नुहोस्</small></div><i class="fa fa-chevron-right text-muted"></i>`;
                    container.appendChild(div);
                });
            } else { container.innerHTML = "<p class='text-center'>No data found.</p>"; }
        });
    };

    window.showGKDetail = (title, content) => {
        showSection('gk-detail-view');
        document.getElementById('detail-set-title').innerText = title;
        const container = document.getElementById('detail-content');
        container.innerHTML = "";
        const lines = content.split('\n');
        let qCount = 0;

        lines.forEach(line => {
            if(line.trim() === "") return;
            const div = document.createElement('div');
            if (line.includes('?') || /^\d+\./.test(line.trim())) {
                qCount++;
                div.className = "q-text";
                div.innerText = line;
                container.appendChild(div);
            } else {
                div.className = "a-text";
                div.innerText = "उत्तर: " + line;
                container.appendChild(div);

                if (qCount > 0 && qCount % 2 === 0) {
                    const adId = `ad-zone-${qCount}-${Date.now()}`;
                    const adSlot = document.createElement('div');
                    adSlot.id = adId;
                    adSlot.className = "ad-slot-container";
                    container.appendChild(adSlot);

                    const script = document.createElement('script');
                    script.src = 'https://nap5k.com/tag.min.js';
                    script.dataset.zone = '10823338';
                    document.getElementById(adId).appendChild(script);
                }
            }
        });
    };

    window.loadFirebaseHome = (type) => {
        showSection('firebase-content-view');
        document.getElementById('firebase-content-title').innerText = type;
        onValue(ref(db, 'home_content/' + type), (s) => {
            const d = s.val();
            document.getElementById('firebase-container').innerHTML = d ? `<div class="gk-detail-container shadow-sm"><div class="gk-question-box">${d.text}</div>${d.link ? `<a href="${d.link}" target="_blank" class="btn btn-danger w-100 mt-2">Download Now</a>` : ''}</div>` : "<p class='text-center'>No data.</p>";
        });
    };
</script>

<script>
    let currentCategory = "";
    function showSection(id) {
        document.querySelectorAll('.container > div, #gk-detail-view, #quiz-active-view').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        window.scrollTo(0,0);
    }
    function updateUI(bal) {
        const b = parseFloat(bal || 0).toFixed(2);
        document.getElementById('user-balance').innerText = b;
        document.getElementById('modal-balance').innerText = b;
    }
    function openWallet() {
        if(!window.currentUserUID) { alert("पहिले लगइन गर्नुहोस्!"); showSection('auth-view'); return; }
        const modal = new bootstrap.Modal(document.getElementById('walletModal'));
        modal.show();
    }
    function showWalletForm(t) {
        document.getElementById('deposit-ui').classList.toggle('hidden', t !== 'deposit');
        document.getElementById('withdraw-ui').classList.toggle('hidden', t !== 'withdraw');
    }
    function copyToClipboard(text, type) {
        navigator.clipboard.writeText(text).then(() => alert(type + " Number Copied!"));
    }
    function showDashboard(cat) {
        currentCategory = cat;
        showSection('dashboard-view');
        document.getElementById('category-title').innerText = cat;
        bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasNavbar'))?.hide();
    }
    const cats = ["Kharidar", "Subba", "Army", "NepalPolice", "APF"];
    cats.forEach(c => {
        const menu = document.getElementById('categoryMenu');
        if(menu) menu.innerHTML += `<a class="nav-link-custom" onclick="showDashboard('${c}')">${c} GK</a>`;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
