<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>समाचार पढ्नुहोस् - सञ्चार पाटी</title>

    <meta property="og:type" content="article" />
    <meta property="og:title" id="meta-title" content="सञ्चार पाटी" />
    <meta property="og:description" id="meta-desc" content="ताजा समाचारको लागि सञ्चार पाटी पढ्नुहोस्।" />
    <meta property="og:image" id="meta-image" content="https://your-website.com/logo.png" />
    <meta property="og:url" id="meta-url" content="" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>(function(s){s.dataset.zone='10913364',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        :root { --primary-red: #d32f2f; --bg-gray: #f4f6f9; --white: #ffffff; --text-dark: #1a1a1a; --fb-blue: #1877F2; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-dark); line-height: 1.8; overflow-x: hidden; }

        header { background: var(--primary-red); color: var(--white); padding: 12px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        .back-btn { position: absolute; left: 15px; color: white; font-size: 20px; text-decoration: none; }

        .content-container { max-width: 800px; margin: 0 auto; background: var(--white); min-height: 100vh; }
        .thumb-wrapper { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #eee; }
        .main-thumbnail { width: 100%; height: 100%; object-fit: cover; display: block; }

        .post-body { padding: 20px; }
        .post-title { font-size: 26px; font-weight: 800; line-height: 1.3; margin-bottom: 15px; color: #000; }
        .post-meta { font-size: 14px; color: #666; margin-bottom: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .post-description { font-size: 20px; color: #333; margin-bottom: 20px; white-space: pre-wrap; }

        .fb-share-small { background: var(--fb-blue); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; display: inline-flex; align-items: center; font-weight: bold; margin-bottom: 25px; }
        .interaction-bar { display: flex; justify-content: space-between; padding: 15px 0; border-top: 1px solid #eee; margin-top: 20px; }
        .stat-item { flex: 1; text-align: center; cursor: pointer; }
        .stat-item i { display: block; font-size: 20px; color: var(--primary-red); }

        #toast { visibility: hidden; background: #333; color: #fff; padding: 10px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 5px; z-index: 10001; }
        #toast.show { visibility: visible; }
        #loader { text-align: center; padding: 50px; font-size: 20px; color: #888; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2 style="font-size: 20px;">सञ्चार पाटी</h2>
    </header>

    <div class="content-container" id="mainContent" style="display:none;">
        <div class="thumb-wrapper">
            <img id="postImg" src="" class="main-thumbnail">
        </div>

        <div class="post-body">
            <h1 class="post-title" id="postTitle">लोड हुँदैछ...</h1>
            
            <div class="post-meta">
                <span id="postDate"><i class="far fa-calendar-alt"></i> ...</span>
                <span id="postCat"><i class="fas fa-tag"></i> ...</span>
            </div>

            <div class="post-description" id="postDesc">
                समाचार लोड हुँदैछ, कृपया केही समय पर्खनुहोस्...
            </div>

            <div style="text-align: center;">
                <a href="#" class="fb-share-small" onclick="shareFB()">
                    <i class="fab fa-facebook-f"></i> Facebook मा सेयर गर्नुहोस्
                </a>
            </div>

            <div class="interaction-bar">
                <div class="stat-item">
                    <i class="fas fa-eye"></i>
                    <b id="v-count">...</b>
                    <p>Views</p>
                </div>
                <div class="stat-item" onclick="copyAndShare()">
                    <i class="fas fa-share-alt"></i>
                    <b>Share</b>
                    <p>Copy Link</p>
                </div>
            </div>
        </div>
    </div>

    <div id="loader">
        <i class="fas fa-spinner fa-spin"></i> समाचार लोड हुँदैछ...
    </div>

    <div id="toast">लिङ्क कपी भयो !</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "1ce07fc2347e93005cf3399105421644",
            authDomain: "news-channel-4116c.firebaseapp.com",
            projectId: "news-channel-4116c",
            storageBucket: "news-channel-4116c.firebasestorage.app",
            messagingSenderId: "762705666491",
            appId: "1:762705666491:web:6552eeecb9dabd9f34249e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        async function getPostData() {
            if (!postId) return;
            try {
                const docRef = doc(db, "posts", postId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const post = docSnap.data();
                    
                    // पेजमा डेटा भर्ने
                    document.getElementById('postTitle').innerText = post.title;
                    document.getElementById('postImg').src = post.image;
                    document.getElementById('postDesc').innerText = post.desc;
                    document.getElementById('postCat').innerHTML = `<i class="fas fa-tag"></i> ${post.category}`;
                    const postDate = post.date ? new Date(post.date).toLocaleDateString('ne-NP') : 'अज्ञात';
                    document.getElementById('postDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${postDate}`;

                    // --- Facebook Meta Tags Update (नयाँ थपिएको) ---
                    document.getElementById('meta-title').setAttribute('content', post.title);
                    document.getElementById('meta-desc').setAttribute('content', post.desc.substring(0, 150) + "...");
                    document.getElementById('meta-image').setAttribute('content', post.image);
                    document.getElementById('meta-url').setAttribute('content', window.location.href);
                    document.title = post.title + " - सञ्चार पाटी";
                    // ------------------------------------------------

                    await updateDoc(docRef, { views: increment(1) });
                    document.getElementById('v-count').innerText = (post.views || 0) + 1;
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                }
            } catch (e) { console.error(e); }
        }
        getPostData();
    </script>

    <script>
        function shareFB() {
            const url = window.location.href;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'width=600,height=400');
        }

        function copyAndShare() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 3000);
            });
        }

        window.onload = function() {
            setTimeout(function() {
                var vignetteScript = document.createElement('script');
                vignetteScript.dataset.zone = '10913365';
                vignetteScript.src = 'https://n6wxm.com/vignette.min.js';
                (document.body || document.documentElement).appendChild(vignetteScript);
            }, 7000); 
        };
    </script>

</body>
</html>
